<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent Deployments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
/* ---------------------------------------------------------------- design tokens */
:root {
  --bg: #090a0f; --bg-glow-1: rgba(124, 108, 255, .22); --bg-glow-2: rgba(45, 212, 191, .14);
  --panel: rgba(255, 255, 255, .035); --panel-solid: #12131a; --panel-hi: rgba(255, 255, 255, .06);
  --ink: #eef0f6; --muted: #8d92a3; --line: rgba(255, 255, 255, .09);
  --accent: #8f80ff; --accent-2: #2dd4bf; --accent-soft: rgba(143, 128, 255, .14);
  --grad: linear-gradient(135deg, #8f80ff 0%, #5fa8ff 50%, #2dd4bf 100%);
  --good: #4ade80; --good-soft: rgba(74, 222, 128, .12); --bad: #ff6b81; --bad-soft: rgba(255, 107, 129, .12);
  --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .12);
  --agent: rgba(255, 255, 255, .06); --caller-ink: #0b0c10; --code: rgba(255, 255, 255, .05);
  --shadow: 0 20px 60px -20px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f5fa; --bg-glow-1: rgba(124, 108, 255, .16); --bg-glow-2: rgba(45, 212, 191, .12);
    --panel: rgba(255, 255, 255, .78); --panel-solid: #ffffff; --panel-hi: rgba(20, 20, 40, .04);
    --ink: #15161d; --muted: #5f6577; --line: rgba(20, 20, 40, .1);
    --accent: #6a5cff; --accent-2: #0fae9e; --accent-soft: rgba(106, 92, 255, .1);
    --grad: linear-gradient(135deg, #6a5cff 0%, #3b8bff 50%, #0fae9e 100%);
    --good: #15803d; --good-soft: rgba(21, 128, 61, .1); --bad: #d0254a; --bad-soft: rgba(208, 37, 74, .08);
    --warn: #a16207; --warn-soft: rgba(161, 98, 7, .1);
    --agent: rgba(20, 20, 40, .05); --caller-ink: #ffffff; --code: rgba(20, 20, 40, .04);
    --shadow: 0 20px 50px -24px rgba(40, 40, 90, .25);
    color-scheme: light;
  }
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font: 15px/1.6 Inter, system-ui, sans-serif; min-height: 100vh;
  background:
    radial-gradient(900px 500px at 12% -10%, var(--bg-glow-1), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, var(--bg-glow-2), transparent 55%),
    var(--bg);
  background-attachment: fixed;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
::selection { background: var(--accent-soft); }

header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: 12px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
.brand:hover { text-decoration: none; }
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .02em; margin-top: -3px; }
.mark { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 18px var(--bg-glow-1), inset 0 0 8px rgba(255,255,255,.35); position: relative; }
.mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); opacity: .55; }
nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
nav a { color: var(--muted); padding: 6px 11px; border-radius: 9px; font-weight: 500; font-size: 14px; }
nav a:hover { color: var(--ink); background: var(--panel-hi); text-decoration: none; }
nav a.on { color: var(--ink); background: var(--panel-hi); box-shadow: inset 0 0 0 1px var(--line); }
.pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); }
.pill.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 8px var(--good); }
.pill.no { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.meter { color: var(--muted); font-family: "JetBrains Mono", monospace; font-weight: 500; }

main { max-width: 1200px; margin: 0 auto; padding: 34px 22px 90px; }
h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.03em; margin: 0 0 10px; font-weight: 800; }
h2 { font-size: 20px; margin: 40px 0 14px; letter-spacing: -.02em; }
h3 { font-size: 15px; margin: 0 0 8px; letter-spacing: -.01em; }
.lede { color: var(--muted); max-width: 760px; font-size: 16.5px; margin: 0 0 26px; }
.eyebrow { font: 600 11.5px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 14px; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
a.card:hover { text-decoration: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-2px); }
a.card { transition: transform .2s, border-color .2s; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.gray { background: var(--panel-hi); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tabs { display: flex; gap: 4px; margin: 22px 0 22px; overflow-x: auto; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: fit-content; max-width: 100%; }
.tabs a { padding: 8px 14px; color: var(--muted); font-weight: 600; font-size: 14px; border-radius: 10px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); background: var(--panel-hi); box-shadow: inset 0 0 0 1px var(--line); }
button, select, input { font: inherit; color: var(--ink); }
button { background: var(--grad); color: #fff; border: 0; border-radius: 11px; padding: 9px 16px; font-weight: 600; cursor: pointer;
  box-shadow: 0 8px 24px -10px var(--accent); transition: transform .15s, opacity .15s; }
button:hover:not(:disabled) { transform: translateY(-1px); }
button.ghost { background: var(--panel-hi); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
button:disabled { opacity: .45; cursor: not-allowed; }
select, input[type=text], input[type=datetime-local] { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; min-width: 0; max-width: 100%; }
input[type=text]:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
pre, code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }
pre { background: var(--code); border: 1px solid var(--line); padding: 14px 16px; border-radius: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
td.pre { white-space: pre-wrap; }
.tablewrap { overflow-x: auto; }
.notice { background: var(--warn-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; }
.notice code { background: var(--panel-hi); padding: 1px 5px; border-radius: 5px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.clickable { cursor: pointer; } .clickable:hover td { background: var(--panel-hi); }
details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }

/* ---------------------------------------------------------------- overview */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 30px; align-items: center; margin-bottom: 26px; }
.hero h1 { font-size: clamp(32px, 4.6vw, 52px); }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .cta a { padding: 11px 18px; border-radius: 12px; font-weight: 600; }
.hero .cta a.primary { background: var(--grad); color: #fff; box-shadow: 0 10px 30px -10px var(--accent); }
.hero .cta a.secondary { background: var(--panel-hi); color: var(--ink); border: 1px solid var(--line); }
.hero .cta a:hover { text-decoration: none; transform: translateY(-1px); }
.stage { display: grid; place-items: center; padding: 20px 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 10px 0 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat b { display: block; font-size: 26px; letter-spacing: -.03em; }
.stat span { color: var(--muted); font-size: 13px; }
.arch { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: stretch; }
.arch .box { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--panel-hi); }
.arch .box ul { margin: 8px 0 0; padding-left: 18px; }
.arch .box li { margin: 3px 0; }
.arch .arrow { align-self: center; color: var(--accent); font-size: 22px; }
.steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.step { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 14px; }
.step b { flex: 0 0 28px; height: 28px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 13px; }
.finding { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; }
.finding .chip { font-family: "JetBrains Mono", monospace; }

.why p { margin: 0 0 10px; max-width: 820px; }
.modes { display: flex; gap: 4px; padding: 3px; background: var(--panel-hi); border-radius: 12px; width: fit-content; margin-bottom: 12px; }
.modes a { padding: 6px 12px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 9px; }
.modes a:hover { text-decoration: none; color: var(--ink); }
.modes a.on { color: var(--ink); background: var(--panel-solid); box-shadow: 0 1px 0 var(--line); }
.vapictl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.vapictl #vstart { padding: 11px 20px; font-size: 15px; }
.msg.partial { opacity: .6; }
.synth { font-size: 13px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; margin-bottom: 14px; }

/* ---------------------------------------------------------------- voice orb */
.orb-wrap { display: grid; place-items: center; gap: 14px; }
.orb { --size: 150px; width: var(--size); height: var(--size); border-radius: 50%; position: relative; background: var(--grad);
  box-shadow: 0 0 70px -6px var(--accent), 0 0 120px -30px var(--accent-2), inset 0 0 30px rgba(255,255,255,.25);
  animation: breathe 5s ease-in-out infinite; }
.orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.65), transparent 38%),
              conic-gradient(from 0deg, transparent, rgba(255,255,255,.18), transparent 40%);
  animation: spin 9s linear infinite; }
.orb::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--accent-2); opacity: 0; }
.orb.small { --size: 92px; }
.orb.speaking { animation: talk .55s ease-in-out infinite alternate; }
.orb.listening::after { animation: ripple 1.4s ease-out infinite; }
.orb.listening { box-shadow: 0 0 80px -4px var(--accent-2), inset 0 0 30px rgba(255,255,255,.25); }
.orb.thinking { animation: breathe 1.6s ease-in-out infinite; filter: saturate(.7) brightness(.9); }
.orb.thinking::before { animation-duration: 1.6s; }
.wave { display: flex; gap: 4px; align-items: center; height: 34px; }
.wave i { width: 4px; height: 6px; border-radius: 4px; background: var(--grad); opacity: .55; transition: height .2s; }
.wave.on i { animation: bar 0.9s ease-in-out infinite; opacity: 1; }
.wave i:nth-child(3n) { animation-delay: -.3s; } .wave i:nth-child(3n+1) { animation-delay: -.6s; }
.wave i:nth-child(4n) { animation-duration: .7s; } .wave i:nth-child(5n) { animation-duration: 1.1s; }
.voice-label { font: 600 12px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes talk { from { transform: scale(.97); } to { transform: scale(1.08); } }
@keyframes ripple { from { opacity: .8; transform: scale(.95); } to { opacity: 0; transform: scale(1.35); } }
@keyframes bar { 0%, 100% { height: 6px; } 50% { height: 30px; } }
@media (prefers-reduced-motion: reduce) { .orb, .orb::before, .orb::after, .wave i { animation: none !important; } }

/* ---------------------------------------------------------------- call page */
.call { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.call .side { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
.phone-head { display: flex; align-items: center; gap: 18px; padding-bottom: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.phone-head .who-call { flex: 1; min-width: 0; }
.phone-head .who-call b { display: block; font-size: 16px; }
.timer { font: 600 14px/1 "JetBrains Mono", monospace; color: var(--muted); }
.timer.live { color: var(--good); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.controls > * { flex: 1 1 180px; min-width: 0; }
.controls button { flex: 0 0 auto; }
.chat { height: clamp(260px, calc(100vh - 520px), 520px); overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; animation: rise .25s ease-out; }
.msg.agent { background: var(--agent); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 5px; }
.msg.caller { background: var(--grad); color: var(--caller-ink); align-self: flex-end; border-bottom-right-radius: 5px; font-weight: 500; }
.msg.sys { align-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.who { font-size: 10.5px; font-weight: 700; opacity: .7; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .08em; }
.dock { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.dock input { flex: 1; min-width: 0; }
.micbtn { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 20px; }
.micbtn.live { background: var(--bad); box-shadow: 0 0 0 6px var(--bad-soft), 0 0 30px var(--bad); }
.voicebar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.voicebar label { display: flex; gap: 6px; align-items: center; }
.voicebar select { max-width: 230px; padding: 5px 9px; font-size: 13px; }
.minitabs { display: flex; gap: 4px; margin: -4px 0 14px; padding: 3px; background: var(--panel-hi); border-radius: 12px; width: fit-content; }
.minitabs a { padding: 6px 12px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 9px; }
.minitabs a:hover { text-decoration: none; color: var(--ink); }
.minitabs a.on { color: var(--ink); background: var(--panel-solid); box-shadow: 0 1px 0 var(--line); }
h3.sub { font-size: 11.5px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.guides { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 14px; }
.guide { flex: 0 0 240px; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 14px; font-weight: 400; box-shadow: none; }
.guide b { display: block; font-size: 14px; margin-bottom: 3px; }
.guide span { font-size: 12px; color: var(--muted); }
.guide:hover { transform: translateY(-2px); }
.guide.on { border-color: var(--accent); background: var(--accent-soft); }
.script { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--panel-hi); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; }
.script .k { font: 600 10.5px/1 "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-2); display: block; margin-bottom: 5px; }

/* timeline of what code did */
.events { display: flex; flex-direction: column; gap: 0; position: relative; }
.ev { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 0; position: relative; animation: rise .25s ease-out; }
.ev::before { content: ""; position: absolute; left: 13px; top: 34px; bottom: -8px; width: 2px; background: var(--line); }
.ev:last-child::before { display: none; }
.ev .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px;
  background: var(--accent-soft); color: var(--accent); }
.ev.green .dot { background: var(--good-soft); color: var(--good); }
.ev.amber .dot { background: var(--warn-soft); color: var(--warn); }
.ev.red .dot { background: var(--bad-soft); color: var(--bad); box-shadow: 0 0 16px -2px var(--bad); }
.ev b { display: block; font-size: 14px; }
.ev .sub { color: var(--muted); font-size: 12.5px; }

/* markdown documents */
.md { max-width: 880px; }
.md h1 { font-size: 26px; } .md h2 { border-top: 1px solid var(--line); padding-top: 22px; font-size: 19px; }
.md table { margin: 10px 0 18px; }
.md blockquote { margin: 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--panel-hi); border-radius: 0 10px 10px 0; color: var(--muted); }
.md .mermaid { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 14px 0; overflow-x: auto; }
.md li { margin: 3px 0; }

/* ---------------------------------------------------------------- small screens */
@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .stage { order: -1; padding: 0; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  header { position: static; }
  .bar { gap: 10px; padding: 10px 16px; }
  nav { flex: 1 1 100%; order: 3; flex-wrap: nowrap; overflow-x: auto; }
  nav a { white-space: nowrap; }
  main { padding: 22px 16px 60px; }
  h1 { font-size: 26px; }
  .arch { grid-template-columns: 1fr; } .arch .arrow { transform: rotate(90deg); justify-self: center; }
  .call { grid-template-columns: minmax(0, 1fr); }
  .call .side { position: static; max-height: none; }
  .orb { --size: 110px; }
}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/"><span class="mark"></span><span><span id="appname"></span><small id="apptag"></small></span></a>
  <nav id="nav"></nav>
  <span id="meter" class="pill meter" title="API spend from this web app today, against the daily budget"></span>
  <span id="status" class="pill"></span>
</div></header>
<main id="main"></main>

<script>
// The project's name lives here and only here.
const APP = {name: "Voice Agent Deployments", tagline: "A case study by Meghna Sarda"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// A random id so a hosted demo can give each visitor their own private copy of the clinic.
let VISITOR = store.get("visitor");
if (!VISITOR) { VISITOR = (crypto.randomUUID?.() || String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9-]/g, ""); store.set("visitor", VISITOR); }
const headers = () => ({"Content-Type": "application/json", "X-Visitor": VISITOR});
const api = async (path, opts) => {
  const r = await fetch(path, opts ? {method: opts.method || "POST", headers: headers(), body: JSON.stringify(opts.body || {})}
                                   : {headers: headers()});
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
};
const DARK = !matchMedia("(prefers-color-scheme: light)").matches;
mermaid.initialize({startOnLoad: false, theme: DARK ? "dark" : "neutral"});
const wave = (n = 28, on = false) => `<div class="wave ${on ? "on" : ""}">${"<i></i>".repeat(n)}</div>`;

let STATUS = {}, CUSTOMERS = [];
const WF_LABEL = {red_flags: "Red flags", triage: "Triage", identity: "Identity", scheduling: "Scheduling", handoff: "Handoff"};

async function boot() {
  $("#appname").textContent = APP.name;
  $("#apptag").textContent = APP.tagline;
  [STATUS, CUSTOMERS] = await Promise.all([api("/api/status"), api("/api/customers")]);
  const s = $("#status");
  const label = STATUS.live_calls === "off" ? "Live calls offline" : STATUS.public ? "Live calls on" : `Live · ${STATUS.model}`;
  s.textContent = label;
  s.className = "pill " + (STATUS.live_calls === "off" ? "no" : "ok");
  if (STATUS.spent_today == null) $("#meter").remove();
  else updateMeter(STATUS.spent_today, STATUS.daily_budget);
  window.addEventListener("hashchange", route);
  route();
}

function updateMeter(spent, budget) {
  if (spent == null || !$("#meter")) return;
  const m = $("#meter");
  m.textContent = `$${spent.toFixed(2)} / $${budget.toFixed(2)} today`;
  m.classList.toggle("no", spent >= budget * 0.8);
}

function setNav(active) {
  const links = [["#/", "Overview"], ...CUSTOMERS.map(c => [`#/c/${c.id}`, c.name]), ["#/runs", "Eval runs"], ["#/writeup", "Findings & decisions"]];
  $("#nav").innerHTML = links.map(([h, t]) => `<a href="${h}" class="${active === h ? "on" : ""}">${esc(t)}</a>`).join("");
}

function route() {
  const h = location.hash || "#/";
  const parts = h.slice(2).split("/");
  window.scrollTo(0, 0);
  if (parts[0] === "c") { setNav(`#/c/${parts[1]}`); return customerPage(parts[1], parts[2] || "workflow"); }
  if (parts[0] === "writeup") { setNav("#/writeup"); return writeupPage(parts[1] || "findings"); }
  if (parts[0] === "runs") { setNav("#/runs"); return parts[1] ? runPage(parts[1], parts[2]) : runsPage(); }
  setNav("#/"); overview();
}

// The hero orb cycles through the states a real call goes through.
let HERO_TIMER = null;
function cycleHero() {
  clearInterval(HERO_TIMER);
  const states = [["listening", "Listening for the real problem"], ["thinking", "Applying the client's rules"],
                  ["speaking", "Handing off with a clean summary"]];
  let i = 0;
  const step = () => {
    const orb = $("#heroorb"); if (!orb) return clearInterval(HERO_TIMER);
    orb.className = "orb " + states[i][0]; $("#herolabel").textContent = states[i][1];
    i = (i + 1) % states.length;
  };
  step(); HERO_TIMER = setInterval(step, 2600);
}

// ---- natural voice through Vapi: Vapi is the ears and voice; this project's agent is the brain
let MODE = null;                       // "vapi" or "browser"
let VAPI = null, VCALL = null, VSTART = null, VPOLL = null, VPARTIAL = null, VSTAFF = null, VLOG = [];

function vapiAvailable() { return !!(STATUS.vapi && STATUS.vapi.customer === CUR.id); }

function setupModes() {
  if (!vapiAvailable()) { MODE = "browser"; return; }
  MODE = MODE || "vapi";
  const name = esc(CUR.agent_name || "the agent");
  $(".phone-head").insertAdjacentHTML("afterend", `
    <div class="modes"><a data-mode="vapi">Natural voice</a><a data-mode="browser">Browser voice & typing</a></div>
    <div id="vapictl" class="vapictl">
      <button id="vstart">📞 Call ${name}</button><button id="vstop" class="ghost" disabled>Hang up</button>
      <span class="small muted">Talk through your microphone. Vapi provides the voice; ${name}'s brain is this project's code.</span>
    </div>`);
  document.querySelectorAll(".modes a").forEach(a => a.onclick = () => { MODE = a.dataset.mode; applyMode(); });
  $("#vstart").onclick = startVapiCall;
  $("#vstop").onclick = () => VAPI?.stop();
  if (VSTART) {  // a voice call is still running: bring back what was said
    $("#chat").innerHTML = ""; VLOG.forEach(l => bubble(l.who, l.text));
    $("#vstart").disabled = true; $("#vstop").disabled = false; startTimer(); voiceState("idle", "On call");
  }
  applyMode();
}

function applyMode() {
  document.querySelectorAll(".modes a").forEach(a => a.classList.toggle("on", a.dataset.mode === MODE));
  const v = MODE === "vapi";
  $("#vapictl").style.display = v ? "" : "none";
  for (const sel of [".controls", "#sayform", ".voicebar", "#voicenote"]) { const el = $(sel); if (el) el.style.display = v ? "none" : ""; }
}

async function startVapiCall() {
  stopListening(); window.speechSynthesis?.cancel();
  $("#vstart").disabled = true;
  try {
    if (!VAPI) {
      const mod = await import("https://esm.sh/@vapi-ai/web");
      const Vapi = mod.default?.default || mod.default;
      VAPI = new Vapi(STATUS.vapi.public_key);
      wireVapi();
    }
    $("#chat").innerHTML = ""; VLOG = []; VSTAFF = null; LAST = null;
    bubble("sys", "Connecting… allow microphone access if your browser asks.");
    const call = await VAPI.start(STATUS.vapi.assistant_id);
    VCALL = call?.id || null;
    $("#calltitle").textContent = `On a call with ${CUR.name}`;
    $("#callsub").textContent = VCALL ? "Natural voice via Vapi" : "Natural voice via Vapi (live panel unavailable for this call)";
  } catch (e) {
    bubble("sys", "Couldn't start the call: " + (e?.message || e?.error?.message || e));
    $("#vstart").disabled = false;
  }
}

function wireVapi() {
  VAPI.on("call-start", () => {
    VSTART = Date.now(); startTimer(); voiceState("idle", "On call");
    $("#vstop").disabled = false; $("#chat").innerHTML = ""; bubble("sys", "Call connected");
    clearInterval(VPOLL); VPOLL = setInterval(pollVoice, 2000);
  });
  VAPI.on("call-end", () => {
    clearInterval(VPOLL); pollVoice(); stopTimer(); VSTART = null;
    voiceState("idle", "Call ended"); bubble("sys", "Call ended.");
    if ($("#vstop")) { $("#vstop").disabled = true; $("#vstart").disabled = false; }
  });
  VAPI.on("speech-start", () => voiceState("speaking"));
  VAPI.on("speech-end", () => voiceState("listening"));
  VAPI.on("message", m => {
    if (m?.type === "speech-update" && m.role === "assistant") voiceState(m.status === "started" ? "speaking" : "listening");
    if (m?.type !== "transcript") return;
    const who = m.role === "assistant" ? "agent" : "caller";
    if (m.transcriptType === "partial") {
      if (!VPARTIAL || VPARTIAL.dataset.who !== who || !VPARTIAL.isConnected) {
        VPARTIAL?.remove(); VPARTIAL = bubble(who, m.transcript);
        if (VPARTIAL) { VPARTIAL.dataset.who = who; VPARTIAL.classList.add("partial"); }
      } else VPARTIAL.lastChild.textContent = m.transcript;
      return;
    }
    VPARTIAL?.remove(); VPARTIAL = null;
    VLOG.push({who, text: m.transcript}); bubble(who, m.transcript);
  });
  VAPI.on("error", e => { console.error("Vapi error", e); bubble("sys", "Voice error: " + describeVapiError(e)); });
}

function describeVapiError(e) {
  const pick = o => o && (o.errorMsg || o.message || o.msg || o.reason || o.type);
  const text = pick(e?.error?.error) || pick(e?.error) || pick(e);
  if (text && typeof text === "string") return text;
  try { return JSON.stringify(e).slice(0, 300); } catch { return "unknown error (see the browser console)"; }
}

async function pollVoice() {
  if (!VCALL) return;
  try {
    const v = await api(`/api/voice/calls/${VCALL}`);
    if (v.found) { LAST = v; VSTAFF = v.staff; renderSide(); }
  } catch {}
}

function voiceState(state, label) {
  const orb = $("#orb"); if (!orb) return;
  orb.className = "orb small " + (state === "idle" ? "" : state);
  $("#vstate").textContent = label || {idle: CALL && !CALL_OVER ? "On call" : "Ready", speaking: "Agent speaking",
    listening: "Listening", thinking: "Thinking"}[state];
}

function startTimer() {
  clearInterval(TICK);
  const t = $("#timer");
  const draw = () => {
    const t0 = VSTART || CALL?.started;
    if (!$("#timer") || !t0) return clearInterval(TICK);
    const s = Math.floor((Date.now() - t0) / 1000);
    $("#timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };
  t.classList.add("live"); draw(); TICK = setInterval(draw, 1000);
}

function stopTimer() { clearInterval(TICK); $("#timer")?.classList.remove("live"); }

function useGuide(g, btn) {
  document.querySelectorAll(".guide").forEach(x => x.classList.toggle("on", x === btn));
  const sel = $("#caller");
  if (![...sel.options].some(o => o.value === g.phone)) sel.add(new Option(g.you_are, g.phone), 0);
  sel.value = g.phone;
  if (g.when) {
    const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $("#when").value = `${d}T${g.when}`;
  }
  $("#script").innerHTML = `<div class="script">
    <div><span class="k">You are</span>${esc(g.you_are)}</div>
    <div><span class="k">Try saying</span>“${esc(g.say)}” <a href="#" id="useline" class="small">use this line</a></div>
    <div><span class="k">Watch for</span>${esc(g.watch)}</div></div>`;
  $("#useline").onclick = e => { e.preventDefault(); $("#text").value = g.say; $("#text").focus(); };
}

async function restoreCall() {
  LAST = null;
  if (!CALL || CALL.cid !== CUR.id) return renderSide();
  try {
    const r = await api(`/api/calls/${CALL.id}`);
    $("#chat").innerHTML = "";
    showCaller();
    r.transcript.forEach(t => bubble(t.speaker, t.text));
    LAST = r;
    CALL_OVER = r.ended;
    if (r.ended) { bubble("sys", "The agent ended the call."); voiceState("idle", "Call ended"); }
    else { startTimer(); voiceState("idle"); }
    setInputs(!r.ended);
  } catch { CALL = null; saveCall(); }  // the server restarted, so the call is gone
  renderSide();
}

function showCaller() {
  $("#calltitle").textContent = CALL.label || CALL.phone;
  $("#callsub").textContent = `Caller ID ${CALL.phone}`;
}

async function renderSide() {
  document.querySelectorAll(".minitabs a").forEach(a => a.classList.toggle("on", a.dataset.side === SIDE));
  const el = $("#sidebody");
  if (!el) return;
  if (SIDE === "scenes") {
    el.innerHTML = `<p class="small muted" style="margin:0 0 12px">What code did on this call: verification,
      bookings, pages, handoffs, red flags, guardrail flags.</p><div class="events" id="events"></div>`;
    if (LAST) renderEvents(LAST); else $("#events").innerHTML = `<div class="empty small">Nothing yet. Events appear here as the call happens.</div>`;
  } else {
    el.innerHTML = `<p class="small muted" style="margin:0 0 10px">What staff see in their own systems (synthetic data). Updates after every turn.</p>
      <div id="staffbody" class="empty small">Loading…</div>`;
    const s = (MODE === "vapi" && VSTAFF) ? VSTAFF : await api(`/api/customers/${CUR.id}/staff`);
    if (SIDE === "staff" && $("#staffbody")) { $("#staffbody").className = ""; $("#staffbody").innerHTML = staffHTML(s, true); }
  }
}

function canCall() {
  return STATUS.live_calls === "open";
}

function setInputs(on) {
  const can = on && canCall();
  $("#text").disabled = $("#send").disabled = !can;
  $("#mic").disabled = !can || !SpeechRec;
  if (can) $("#text").focus();
}

// ---- browser voice: speech-to-text in, text-to-speech out (free, built into the browser)
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let REC = null, LISTENING = false, CALL_OVER = false;

function rankVoice(v) {  // natural-sounding voices first
  const n = v.name;
  return (/premium|enhanced|neural|natural/i.test(n) ? 0 : /google/i.test(n) ? 1 : /samantha|ava|allison|zoe|evan|nathan/i.test(n) ? 2 : 3)
    + (v.lang === "en-US" ? 0 : 0.5);
}

function setupVoices() {
  const fill = () => {
    const pick = $("#voicepick");
    if (!pick || !window.speechSynthesis) return;
    const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en")).sort((a, b) => rankVoice(a) - rankVoice(b));
    let saved = null; try { saved = localStorage.getItem("voice"); } catch {}
    pick.innerHTML = voices.map(v => `<option ${v.name === saved ? "selected" : ""}>${esc(v.name)}</option>`).join("");
    pick.onchange = () => { try { localStorage.setItem("voice", pick.value); } catch {} };
  };
  fill();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = fill;
}

function speak(text) {
  if (!$("#voice")?.checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const chosen = speechSynthesis.getVoices().find(v => v.name === $("#voicepick")?.value);
  if (chosen) u.voice = chosen;
  u.onstart = () => voiceState("speaking");
  u.onend = () => {
    voiceState(CALL_OVER ? "idle" : "idle", CALL_OVER ? "Call ended" : undefined);
    if ($("#voice")?.checked && !CALL_OVER && CALL) listen();
  };
  speechSynthesis.speak(u);
}

function listen() {
  if (!SpeechRec || LISTENING || !$("#mic") || $("#mic").disabled) return;
  window.speechSynthesis?.cancel();
  REC = new SpeechRec();
  REC.lang = "en-US"; REC.interimResults = true; REC.continuous = false;
  REC.onresult = e => {
    const res = e.results[e.results.length - 1];
    $("#text").value = Array.from(e.results).map(r => r[0].transcript).join(" ");
    if (res.isFinal) { stopListening(); sendLine(); }
  };
  REC.onerror = e => {
    stopListening();
    if (e.error === "no-speech" || e.error === "aborted") return;
    $("#voicenote").textContent = e.error === "not-allowed"
      ? "Microphone blocked. Allow mic access for this page, or open http://localhost:8770 in Chrome."
      : `Voice input failed here (${e.error}). Open http://localhost:8770 in Google Chrome to talk; typing still works.`;
  };
  REC.onend = () => stopListening();
  REC.start(); LISTENING = true;
  $("#mic").classList.add("live"); voiceState("listening");
}

function stopListening() {
  if (REC) { try { REC.stop(); } catch {} }
  const was = LISTENING;
  LISTENING = false;
  $("#mic")?.classList.remove("live");
  if (was) voiceState("idle");
}

function bubble(speaker, text) {
  const chat = $("#chat");
  if (!chat) return null;
  if (chat.querySelector(".empty")) chat.innerHTML = "";
  const d = document.createElement("div");
  d.className = "msg " + speaker;
  d.innerHTML = speaker === "sys" ? esc(text) : `<span class="who">${speaker === "agent" ? (CUR?.agent_name ? `${esc(CUR.agent_name)} · AI` : "AI agent") : "Caller"}</span>${esc(text)}`;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function startCall() {
  let phone = $("#caller").value;
  const label = $("#caller").selectedOptions[0]?.textContent;
  if (phone === "custom") { phone = prompt("Caller ID (e.g. +17735550199)") || ""; if (!phone) return; }
  stopListening(); window.speechSynthesis?.cancel();
  let r;
  try { r = await api(`/api/customers/${CUR.id}/calls`, {body: {caller_phone: phone, call_time: $("#when").value || null}}); }
  catch (e) {
    $("#chat").innerHTML = ""; bubble("sys", e.message); return;
  }
  CALL = {id: r.call_id, cid: CUR.id, phone, label: phone === "custom" ? phone : label, started: Date.now()}; saveCall();
  LAST = null; CALL_OVER = false;
  $("#chat").innerHTML = "";
  showCaller(); startTimer(); voiceState("idle");
  bubble("sys", "Call connected");
  bubble("agent", r.greeting);
  renderSide();
  setInputs(true);
  if (canCall()) speak(r.greeting);
}

async function sendLine() {
  const text = $("#text").value.trim();
  if (!text || !CALL) return;
  $("#text").value = ""; bubble("caller", text);
  setInputs(false);
  voiceState("thinking");
  try {
    const r = await api(`/api/calls/${CALL.id}/say`, {body: {text}});
    LAST = r; CALL_OVER = r.ended;
    updateMeter(r.spent_today, r.daily_budget);
    renderSide();
    voiceState("idle");
    if (r.reply) { bubble("agent", r.reply); speak(r.reply); }
    if (r.ended) { bubble("sys", "The agent ended the call."); stopTimer(); voiceState("idle", "Call ended"); return; }
  } catch (e) { bubble("sys", "Error: " + e.message); voiceState("idle"); }
  setInputs(true);
}

const ICON = {red_flag: "!", identity: "✓", booking: "+", reschedule: "↻", cancel: "×", handoff: "→", report: "◆"};

function describe(e) {
  switch (e.type) {
    case "red_flag": return ["red", `Red flag: ${e.flag.replace(/_/g, " ")}`,
      `${e.then === "stay_on_line" ? "Caller kept on the line; staff alerted to join" : "Told to call 911"} · staff alerted: ${e.staff_alerted} · task ${e.task_id}`];
    case "identity": return [e.verified ? "green" : "amber", e.verified ? "Identity verified" : `Identity not verified (attempt ${e.attempt})`,
      e.as_caregiver ? "Caller is a caregiver" : "Caller is the patient"];
    case "booking": return ["green", "Appointment booked", `${e.start.slice(0, 16).replace("T", " ")} with ${e.clinician} · ${e.visit_type}`];
    case "reschedule": return ["green", "Appointment moved", `New time ${e.start.slice(0, 16).replace("T", " ")} with ${e.clinician}`];
    case "cancel": return ["amber", e.part_of_reschedule ? "Old appointment released" : "Appointment cancelled",
      e.waitlist_offered_to ? `Freed slot offered to ${e.waitlist_offered_to} from the waitlist` : "No waitlist match"];
    case "handoff": return ["", `Handed off to ${e.queue.replace("_", " ")}`, `${e.request} · ${e.verified ? "verified" : "not verified"} · task ${e.task_id}`];
    case "report": return [e.level === "emergency" ? "red" : "", `Reported: ${e.category.replace(/_/g, " ")} → ${e.level}`, e.actions.join(" · ")];
    default: return ["", e.type, JSON.stringify(e)];
  }
}

function renderEvents(r) {
  const items = r.events.map(e => { const [cls, title, sub] = describe(e);
    return `<div class="ev ${cls}"><span class="dot">${ICON[e.type] || "•"}</span><div><b>${esc(title)}</b><span class="sub">${esc(sub)}</span></div></div>`; });
  items.push(...r.guardrail_flags.map(f => `<div class="ev red"><span class="dot">!</span><div><b>Guardrail: ${esc(f.rule.replace(/_/g, " "))}</b><span class="sub">${esc(f.text)}</span></div></div>`));
  let html = items.join("") || `<div class="empty small">Nothing yet. Events appear here as the call happens.</div>`;
  if (r.tool_calls?.length) html += `<details><summary>${r.tool_calls.length} tool calls (raw)</summary><pre>${esc(JSON.stringify(r.tool_calls, null, 2))}</pre></details>`;
  if (r.cost_usd) html += `<p class="small muted" style="margin:12px 0 0">This call so far: $${r.cost_usd.toFixed(3)}</p>`;
  $("#events").innerHTML = html;
}

// ---------------------------------------------------------------- write-up
async function writeupPage(tab) {
  const tabs = [["findings", "Findings"], ["decisions", "Decisions"], ["plan", "Plan"]];
  $("#main").innerHTML = `<div class="eyebrow">The thinking behind the build</div><h1>Findings & decisions</h1>
    <p class="lede">What broke and what it taught, and why each choice was made, with the alternatives considered.</p>
    <div class="tabs">${tabs.map(([k, t]) => `<a href="#/writeup/${k}" class="${k === tab ? "on" : ""}">${t}</a>`).join("")}</div>
    <div class="card md" id="doc"><div class="empty">Loading…</div></div>`;
  const d = await api(`/api/docs/${tab}`);
  renderMarkdown($("#doc"), d.markdown);
}

async function runsPage() {
  const runs = await api("/api/runs");
  $("#main").innerHTML = `<div class="eyebrow">Evals</div><h1>Eval runs</h1>
    <p class="lede">Each run plays every test scenario for a customer with an AI caller, then grades the call with code checks and an AI judge.
      Run one with <code>.venv/bin/python -m evals.run ravenswood_clinic</code>.</p>
    ${runs.length ? `<div class="card tablewrap"><table><tr><th>Run</th><th>Customer</th><th>When</th><th>Passed</th></tr>
      ${runs.map(r => `<tr class="clickable" onclick="location.hash='#/runs/${r.id}'"><td>${esc(r.id)}</td><td>${esc(r.customer)}</td>
        <td>${new Date(r.when).toLocaleString()}</td><td><span class="chip ${r.passed === r.calls ? "good" : "bad"}">${r.passed}/${r.calls}</span></td></tr>`).join("")}
    </table></div>` : `<div class="card empty">No eval runs yet.</div>`}`;
}

async function runPage(id, scenario) {
  const r = await api(`/api/runs/${id}`);
  if (scenario) {
    const c = r.records.find(x => x.scenario === scenario);
    $("#main").innerHTML = `<p><a href="#/runs/${id}">← ${esc(id)}</a></p><h1>${esc(c.scenario)}
      <span class="chip ${c.passed ? "good" : "bad"}">${c.passed ? "passed" : "failed"}</span></h1>
      <p class="lede">${esc(c.persona)}</p>
      <div class="call"><div class="card"><h3>Transcript</h3><div class="chat" id="chat" style="height:auto;max-height:640px"></div></div>
      <div class="card"><h3>Checks</h3><div class="events">
        ${c.code_checks.map(k => `<div class="ev ${k.passed ? "green" : "red"}"><span class="dot">${k.passed ? "✓" : "×"}</span><div><b>${esc(k.check)}</b><span class="sub">${esc(k.detail)}</span></div></div>`).join("")}</div>
        <h3 style="margin-top:18px">AI judge</h3><div class="events">
        ${c.judge.map(k => `<div class="ev ${k.passed ? "green" : "red"}"><span class="dot">${k.passed ? "✓" : "×"}</span><div><b>${esc(k.criterion)}</b><span class="sub">${esc(k.evidence)}</span></div></div>`).join("")}</div>
        <h3 style="margin-top:18px">What code did</h3><div class="events" id="events"></div></div></div>`;
    c.transcript.forEach(t => bubble(t.speaker, t.text));
    renderEvents(c);
    return;
  }
  $("#main").innerHTML = `<p><a href="#/runs">← All runs</a></p><div class="card md" id="report"></div>
    <h2>Calls</h2><div class="card tablewrap"><table><tr><th>Scenario</th><th>Group</th><th>Result</th></tr>
    ${r.records.map(c => `<tr class="clickable" onclick="location.hash='#/runs/${id}/${c.scenario}'"><td>${esc(c.scenario)}</td>
      <td>${esc(c.group)}</td><td><span class="chip ${c.passed ? "good" : "bad"}">${c.passed ? "passed" : "failed"}</span></td></tr>`).join("")}
    </table></div>`;
  renderMarkdown($("#report"), r.report);
}
